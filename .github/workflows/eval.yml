name: Eval (on demand)
on:
  workflow_dispatch:
    inputs:
      provider: { description: "Provider", default: "mock", required: false }
      dataset: { description: "Dataset path", default: "dataset/v1/baseball.json", required: false }
      judge: { description: "Judge (mock|live)", default: "mock", required: false }
  push:
    paths:
      - "dataset/**"
      - "src/**"
      - "evals/**"

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11.22.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Run eval
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
        run: |
          if [ "${{ github.event.inputs.judge }}" = "live" ]; then
            pnpm eval --live --provider ${{ github.event.inputs.provider || 'mock' }} --dataset ${{ github.event.inputs.dataset || 'dataset/v1/baseball.json' }}
          else
            pnpm eval --mock --provider ${{ github.event.inputs.provider || 'mock' }} --dataset ${{ github.event.inputs.dataset || 'dataset/v1/baseball.json' }} --limit 30
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: |
            evals/results/*.json
            evals/results/*.md
            evals/COMPARISON.md
