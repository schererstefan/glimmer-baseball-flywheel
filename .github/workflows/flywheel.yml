name: Flywheel (nightly hill-climb)
on:
  schedule:
    - cron: "0 3 * * *"  # 03:00 UTC daily — recurring flywheel
  workflow_dispatch:
    inputs:
      max_iters:
        description: "Max iterations"
        required: false
        default: "3"
      dry_run:
        description: "Dry run (no synthetic/train)"
        required: false
        default: "false"
      provider:
        description: "Provider (mock|glimmer)"
        required: false
        default: "mock"

jobs:
  hill-climb:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11.22.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Run flywheel iteration
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
          MOCK_JUDGE: ${{ (secrets.TAVILY_API_KEY == '' && secrets.BRAVE_API_KEY == '') && '1' || '0' }}
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            pnpm flywheel --once --dry-run --provider ${{ github.event.inputs.provider || 'mock' }}
          else
            pnpm flywheel --once --provider ${{ github.event.inputs.provider || 'mock' }} --max-iters ${{ github.event.inputs.max_iters || '1' }}
          fi
      - name: Commit flywheel artifacts
        run: |
          git config user.name "glimmer-bb-flywheel[bot]"
          git config user.email "flywheel@users.noreply.github.com"
          git add -A evals/results/ flywheel/reports/ flywheel/state/ dataset/synthetic/ training/datasets/ || true
          git diff --staged --quiet && echo "no changes" && exit 0
          git commit -m "flywheel: $(date -u +%Y-%m-%d) auto hill-climb — $(cat flywheel/state/flywheel.json | jq -r '.bestAccuracy // 0' 2>/dev/null || echo 'no state')"
          git push

  meta-eval:
    runs-on: ubuntu-latest
    needs: hill-climb
    if: always()
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11.22.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm test -- --runInBand
      - run: echo "meta-eval: judge health, dataset coverage, leakage — see flywheel/reports"
